name: Run UI shard
description: Execute one partition using this run's signed macOS test products
inputs:
  shard:
    description: Partition number from the checked-in UI manifest
    required: true
runs:
  using: composite
  steps:
    - name: Download this run's signed UI test products
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name macos-ui-products --dir .test-results/products
        mkdir -p .build/macos/Build
        tar -xf .test-results/products/macos-ui-products.tar -C .build/macos/Build
        rm .test-results/products/macos-ui-products.tar
    - name: Prepare display for minimum app window
      shell: bash
      run: swift Scripts/prepare-ui-display.swift
    - name: Run deterministic macOS UI acceptance tests
      shell: bash
      env:
        UI_SHARD: ${{ inputs.shard }}
      run: |
        mkdir -p .test-results
        python3 Scripts/run-ui-tests.py "$UI_SHARD" --products .build/macos/Build/Products 2>&1 | tee .test-results/macos-ui.log
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: apple-ui-results-${{ inputs.shard }}
        path: .test-results/
        include-hidden-files: true
