name: Save Swift build cache
description: Save a weekly incremental build seed after successful validation
runs:
  using: composite
  steps:
    - name: Save Swift build products
      if: env.CI_CACHE_SAVE_KEY != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          backend/.build
          packages/Shared/.build
          .build/bundled-backend
        key: ${{ env.CI_CACHE_SAVE_KEY }}
