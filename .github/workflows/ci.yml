name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and run actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Import Swift signing keys
        run: |
          curl --compressed --fail --silent --show-error --location --retry 3 \
            https://www.swift.org/keys/all-keys.asc -o "$RUNNER_TEMP/swift-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.4.2'
      - name: Test Shared and Backend on Linux
        run: |
          mkdir -p .test-results
          swift --version
          swift test --package-path packages/Shared 2>&1 | tee .test-results/shared-linux.log
          swift test --package-path backend 2>&1 | tee .test-results/backend-linux.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-test-results
          path: .test-results/
          include-hidden-files: true

  apple:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned SwiftFormat
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.5/swiftformat.zip \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: Toolchain and commit checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 Scripts/check-development.py
          swiftformat . --lint --config .swiftformat
          base="${CHECK_BASE:-HEAD^}"
          if [[ "$base" =~ ^0+$ ]]; then base=$(git hash-object -t tree /dev/null); fi
          python3 .githooks/pre-commit --base "$base"
          python3 -m unittest discover -s Tests/Hooks -p 'test_*.py'
          python3 -m unittest discover -s Tests/Documentation -p 'test_*.py'
      - name: Check documentation examples and test packages
        run: |
          mkdir -p .test-results
          python3 Scripts/check-documentation-examples.py
          swift test --package-path packages/Shared 2>&1 | tee .test-results/shared-apple.log
          swift test --package-path backend 2>&1 | tee .test-results/backend-apple.log
      - name: Compile the app and tests for iOS Simulator
        run: |
          xcodebuild build-for-testing -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .test-results/ios-build.log
      - name: Compile the app and tests for visionOS Simulator
        run: |
          xcodebuild build-for-testing -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath .build/visionos CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .test-results/visionos-build.log
      - name: Run deterministic macOS UI acceptance tests
        run: |
          xcodebuild test -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'platform=macOS' -derivedDataPath .build/macos \
            -only-testing:unaruUITests CODE_SIGN_IDENTITY=- \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            2>&1 | tee .test-results/macos-ui.log
      - name: Build and verify full DocC site
        run: python3 Scripts/build-documentation.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docc-validation
          path: .build/documentation/docc-validation.tar
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .build/documentation/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: apple-test-results
          path: .test-results/
          include-hidden-files: true

  deploy:
    needs: [apple, ubuntu, workflow-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
      - name: Verify published documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 Scripts/check-documentation-live.py "$PAGE_URL"

defaults:
  run:
    shell: bash
