name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache_namespace:
        description: Cache namespace (use a new value for a cold benchmark)
        default: swift-build-v3
        type: string

env:
  CI_CACHE_NAMESPACE: ${{ inputs.cache_namespace || 'swift-build-v3' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install and run actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Import Swift signing keys
        run: |
          curl --compressed --fail --silent --show-error --location --retry 3 \
            https://www.swift.org/keys/all-keys.asc -o "$RUNNER_TEMP/swift-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-keys.asc"
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3
        with:
          swift-version: '6.4.2'
      - uses: ./.github/actions/swift-build-cache
      - name: Test Shared and Backend on Linux
        run: |
          mkdir -p .test-results
          swift --version
          swift test --package-path packages/Shared 2>&1 | tee .test-results/shared-linux.log
          swift test --package-path backend 2>&1 | tee .test-results/backend-linux.log
          python3 -m unittest discover -s Tests/BackendConfiguration -p 'test_*.py' 2>&1 | tee .test-results/environment-linux.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-test-results
          path: .test-results/
          include-hidden-files: true
      - uses: ./.github/actions/save-swift-build-cache

  apple-build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned SwiftFormat
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.5/swiftformat.zip \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: Toolchain and commit checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 Scripts/check-development.py
          python3 Scripts/format-swift.py --lint
          base="${CHECK_BASE:-HEAD^}"
          if [[ "$base" =~ ^0+$ ]]; then base=$(git hash-object -t tree /dev/null); fi
          python3 .githooks/pre-commit --base "$base"
          python3 -m unittest discover -s Tests/Hooks -p 'test_*.py'
          python3 -m unittest discover -s Tests/Documentation -p 'test_*.py'
          python3 -m unittest discover -s Tests/CI -p 'test_*.py'
      - uses: ./.github/actions/swift-build-cache
      - name: Check documentation examples and test packages
        run: |
          mkdir -p .test-results
          python3 Scripts/check-documentation-examples.py
          swift test --package-path packages/Shared 2>&1 | tee .test-results/shared-apple.log
          swift test --package-path backend 2>&1 | tee .test-results/backend-apple.log
          python3 -m unittest discover -s Tests/BackendConfiguration -p 'test_*.py' 2>&1 | tee .test-results/environment-apple.log
      - name: Build Shared and Backend documentation with the tested packages
        run: python3 Scripts/build-documentation.py --modules Shared Backend
      - name: Compile the app and tests for iOS Simulator
        run: |
          xcodebuild build-for-testing -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .test-results/ios-build.log
      - name: Compile the app and tests for visionOS Simulator
        run: |
          xcodebuild build-for-testing -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath .build/visionos CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee .test-results/visionos-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: apple-build-results
          path: .test-results/
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docc-packages
          path: .build/documentation/docc-validation.tar
          if-no-files-found: error
      - uses: ./.github/actions/save-swift-build-cache

  apple-ui-build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/swift-build-cache
      - name: Build macOS UI tests once for every shard
        run: |
          mkdir -p .test-results
          xcodebuild build-for-testing -project apps/unaru/unaru.xcodeproj -scheme unaru \
            -destination 'platform=macOS' -derivedDataPath .build/macos CODE_SIGN_IDENTITY=- \
            -showBuildTimingSummary 2>&1 | tee .test-results/macos-ui-build.log
          COPYFILE_DISABLE=1 tar -cf .test-results/macos-ui-products.tar -C .build/macos/Build Products
          COPYFILE_DISABLE=1 tar -cf .test-results/native-backend.tar \
            -C .build/macos/Build/Products/Debug/unaru.app/Contents/Helpers Backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-native-backend
          path: .test-results/native-backend.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-ui-products
          path: .test-results/macos-ui-products.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: apple-ui-build-results
          path: .test-results/macos-ui-build.log
      - uses: ./.github/actions/save-swift-build-cache

  apple-ui:
    name: apple-ui (${{ matrix.shard }})
    needs: apple-ui-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ui-shard
        with:
          shard: ${{ matrix.shard }}

  # App documentation releases its Mac slot before the short fourth shard starts.
  apple-ui-final:
    name: apple-ui (4)
    needs: [apple-ui-build, apple-docs]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ui-shard
        with:
          shard: '4'

  apple-docs-helper:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/swift-build-cache
      - name: Compile the Intel Backend helper
        run: |
          mkdir -p .test-results
          scratch="$GITHUB_WORKSPACE/.build/bundled-backend/debug-x86_64"
          env -u SDKROOT -u SDK_DIR xcrun swift build --package-path backend \
            --scratch-path "$scratch" --configuration debug --arch x86_64 \
            --disable-index-store --product Backend 2>&1 | tee .test-results/intel-backend.log
          binary_dir=$(env -u SDKROOT -u SDK_DIR xcrun swift build --package-path backend \
            --scratch-path "$scratch" --configuration debug --arch x86_64 \
            --disable-index-store --show-bin-path)
          COPYFILE_DISABLE=1 tar -cf .test-results/intel-backend.tar -C "$binary_dir" Backend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-intel-backend
          path: .test-results/intel-backend.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: intel-backend-results
          path: .test-results/intel-backend.log
      - uses: ./.github/actions/save-swift-build-cache

  apple-docs:
    needs: [apple-ui-build, apple-docs-helper]
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      UNARU_PREBUILT_BACKENDS_DIR: ${{ github.workspace }}/.test-results/backends
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The action's runtime token limits downloads to this workflow run.
      - name: Download this run's native Backend helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-native-backend
          path: .test-results/backends/arm64
          digest-mismatch: error
      - name: Download this run's Intel Backend helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-intel-backend
          path: .test-results/backends/x86_64
          digest-mismatch: error
      - name: Unpack the current run's helper slices
        run: |
          tar -xf .test-results/backends/arm64/native-backend.tar -C .test-results/backends/arm64
          tar -xf .test-results/backends/x86_64/intel-backend.tar -C .test-results/backends/x86_64
      - name: Build both app architectures and verify app documentation
        run: python3 Scripts/build-documentation.py --modules unaru
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docc-app
          path: .build/documentation/docc-validation.tar
          if-no-files-found: error

  documentation:
    needs: [apple-build, apple-docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this run's package documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docc-packages
          path: .test-results/docc-parts/packages
          digest-mismatch: error
      - name: Download this run's app documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docc-app
          path: .test-results/docc-parts/app
          digest-mismatch: error
      - name: Assemble and verify full DocC site
        run: python3 Scripts/build-documentation.py --assemble-only --inputs .test-results/docc-parts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docc-validation
          path: .build/documentation/docc-validation.tar
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .build/documentation/site

  # Preserve the required check name and reject failed, cancelled, or skipped jobs.
  apple:
    needs: [apple-build, apple-ui-build, apple-ui, apple-ui-final, apple-docs-helper, apple-docs, documentation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Apple check to succeed
        env:
          BUILD_RESULT: ${{ needs.apple-build.result }}
          UI_BUILD_RESULT: ${{ needs.apple-ui-build.result }}
          UI_RESULT: ${{ needs.apple-ui.result }}
          UI_FINAL_RESULT: ${{ needs.apple-ui-final.result }}
          DOCS_HELPER_RESULT: ${{ needs.apple-docs-helper.result }}
          DOCS_RESULT: ${{ needs.apple-docs.result }}
          SITE_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$UI_BUILD_RESULT" = success
          test "$UI_RESULT" = success
          test "$UI_FINAL_RESULT" = success
          test "$DOCS_HELPER_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$SITE_RESULT" = success

  deploy:
    needs: [apple, ubuntu, workflow-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
      - name: Verify published documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 Scripts/check-documentation-live.py "$PAGE_URL"

defaults:
  run:
    shell: bash
